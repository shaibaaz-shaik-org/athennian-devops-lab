###############################################################################
# .github/workflows/drift-detection.yml
# Scheduled drift detection — catches manual changes made outside Terraform
###############################################################################

name: "Drift Detection"

on:
  schedule:
    - cron: "0 6 * * *"  # Run daily at 6am UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  id-token: write
  contents: read
  issues: write   # Create GitHub issue on drift detected

env:
  TF_VERSION: "1.6.6"

jobs:
  detect-drift:
    name: "Detect Drift — ${{ matrix.environment }}"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [dev, staging, production]
      fail-fast: false  # Check all environments even if one drifts

    environment: ${{ matrix.environment }}-readonly

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.environment == 'production' && vars.AWS_ROLE_ARN_PRODUCTION || matrix.environment == 'staging' && vars.AWS_ROLE_ARN_STAGING || vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1
          role-session-name: github-actions-drift-detection

      - name: terraform init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init

      # -detailed-exitcode: 0=no changes, 1=error, 2=changes detected
      - name: terraform plan (drift check)
        id: drift
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          set +e
          terraform plan \
            -var-file="terraform.tfvars" \
            -refresh-only \
            -detailed-exitcode \
            2>&1 | tee plan-output.txt
          EXITCODE=${PIPESTATUS[0]}
          echo "exitcode=$EXITCODE" >> $GITHUB_OUTPUT
          
          if [ "$EXITCODE" = "2" ]; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo "DRIFT DETECTED in ${{ matrix.environment }}"
          elif [ "$EXITCODE" = "0" ]; then
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "No drift in ${{ matrix.environment }}"
          else
            echo "drift_detected=error" >> $GITHUB_OUTPUT
            echo "Error running plan"
          fi

      - name: Save drift output
        if: steps.drift.outputs.drift_detected == 'true'
        run: |
          PLAN=$(cat terraform/environments/${{ matrix.environment }}/plan-output.txt)
          echo "DRIFT_PLAN<<EOF" >> $GITHUB_ENV
          echo "${PLAN}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Create GitHub issue if drift detected — engineers get notified
      - name: Create GitHub Issue for drift
        if: steps.drift.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['drift-detected', '${{ matrix.environment }}'],
              state: 'open'
            });
            
            if (existingIssues.data.length > 0) {
              console.log('Drift issue already open — adding comment');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues.data[0].number,
                body: `### Drift still detected — ${new Date().toISOString()}\n\nSee workflow run for full details.`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Infrastructure Drift Detected — ${{ matrix.environment }} (${new Date().toDateString()})`,
                body: `## Infrastructure Drift Detected
            
            **Environment**: \`${{ matrix.environment }}\`
            **Detected at**: ${new Date().toISOString()}
            **Workflow run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Terraform detected that the current state of AWS resources does not match 
            what is defined in Terraform state. This usually means someone made a manual 
            change in the AWS console or via CLI without going through Terraform.
            
            ### Drift Details
            
            \`\`\`
            ${{ env.DRIFT_PLAN || 'See workflow run for full drift details.' }}
            \`\`\`
            
            ### Resolution Steps
            
            1. Review the changes above
            2. If changes should be kept: update Terraform config to match and run \`terraform import\`
            3. If changes should be reverted: run \`terraform apply\` to restore declared state
            4. Never make manual AWS changes — always use Terraform
            
            ### Useful Commands
            
            \`\`\`bash
            # See current drift
            terraform plan -refresh-only
            
            # List all resources in state
            terraform state list
            
            # Inspect specific resource
            terraform state show <resource>
            
            # Import manually-created resource
            terraform import <resource_type.name> <aws_id>
            \`\`\``,
                labels: ['drift-detected', '${{ matrix.environment }}', 'infrastructure']
              });
            }

      # Slack notification for drift
      - name: Notify Slack on drift
        if: steps.drift.outputs.drift_detected == 'true'
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🚨 Infrastructure Drift Detected",
              "attachments": [{
                "color": "danger",
                "fields": [
                  { "title": "Environment", "value": "${{ matrix.environment }}", "short": true },
                  { "title": "Time", "value": "${{ github.run_started_at }}", "short": true },
                  { "title": "Action Required", "value": "Review and remediate drift immediately", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
