###############################################################################
# .github/workflows/bootstrap.yml
# One-time workflow: deploys Terraform backend (S3 + DynamoDB),
# then deploys the full dev environment — triggered manually
###############################################################################

name: "Bootstrap & Deploy Dev"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm"
        required: true

permissions:
  id-token: write
  contents: write

env:
  TF_VERSION: "1.6.6"
  AWS_REGION: "us-east-1"
  ACCOUNT_ID: "083846066460"

jobs:
  ###########################################################################
  # Step 1 — Deploy Terraform backend (S3 state bucket + DynamoDB lock table)
  ###########################################################################
  bootstrap-backend:
    name: "1 — Bootstrap Terraform Backend"
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DEPLOY'
    permissions:
      id-token: write
      contents: write
    outputs:
      state_bucket: ${{ steps.apply.outputs.state_bucket }}
      lock_table: ${{ steps.apply.outputs.lock_table }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Debug — decode OIDC token claims
        run: |
          # Fetch the OIDC token and decode the payload (no secrets exposed — payload is not sensitive)
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          # Decode JWT payload (middle section)
          PAYLOAD=$(echo "$TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null || \
                    echo "$TOKEN" | cut -d'.' -f2 | python3 -c "import sys,base64; d=sys.stdin.read().strip(); print(base64.b64decode(d + '=='*((4-len(d)%4)%4)).decode())")
          echo "OIDC Token Claims:"
          echo "$PAYLOAD" | python3 -m json.tool 2>/dev/null || echo "$PAYLOAD"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bootstrap-backend

      - name: Terraform init (local backend)
        working-directory: terraform/backend
        run: terraform init -backend=false

      - name: Terraform apply backend
        id: apply
        working-directory: terraform/backend
        run: |
          # Import existing resources if they already exist (idempotent re-runs)
          BUCKET_NAME="athennian-terraform-state-083846066460"
          TABLE_NAME="athennian-terraform-locks"
          KEY_ALIAS="alias/athennian-terraform-state"

          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket exists — importing into state..."
            terraform import -var="project_name=athennian" -var="aws_region=us-east-1" \
              aws_s3_bucket.terraform_state "$BUCKET_NAME" 2>/dev/null || true
          fi

          if aws dynamodb describe-table --table-name "$TABLE_NAME" 2>/dev/null; then
            echo "DynamoDB table exists — importing into state..."
            terraform import -var="project_name=athennian" -var="aws_region=us-east-1" \
              aws_dynamodb_table.terraform_locks "$TABLE_NAME" 2>/dev/null || true
          fi

          KEY_ID=$(aws kms list-aliases --query "Aliases[?AliasName=='$KEY_ALIAS'].TargetKeyId" --output text 2>/dev/null || echo "")
          if [ -n "$KEY_ID" ] && [ "$KEY_ID" != "None" ]; then
            echo "KMS key exists — importing into state..."
            terraform import -var="project_name=athennian" -var="aws_region=us-east-1" \
              aws_kms_key.terraform_state "$KEY_ID" 2>/dev/null || true
            terraform import -var="project_name=athennian" -var="aws_region=us-east-1" \
              aws_kms_alias.terraform_state "$KEY_ALIAS" 2>/dev/null || true
          fi

          terraform apply -auto-approve -input=false \
            -var="project_name=athennian" \
            -var="aws_region=us-east-1"

          STATE_BUCKET=$(terraform output -raw state_bucket_name)
          LOCK_TABLE=$(terraform output -raw lock_table_name)

          echo "state_bucket=$STATE_BUCKET" >> $GITHUB_OUTPUT
          echo "lock_table=$LOCK_TABLE" >> $GITHUB_OUTPUT
          echo "State bucket: $STATE_BUCKET"
          echo "Lock table:   $LOCK_TABLE"

  ###########################################################################
  # Step 2 — Patch backend config in dev environment with real bucket name
  ###########################################################################
  patch-backend-config:
    name: "2 — Patch Backend Config"
    runs-on: ubuntu-latest
    needs: bootstrap-backend
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update backend bucket in dev main.tf
        run: |
          BUCKET="${{ needs.bootstrap-backend.outputs.state_bucket }}"
          TABLE="${{ needs.bootstrap-backend.outputs.lock_table }}"

          sed -i "s|athennian-terraform-state-ACCOUNT_ID|${BUCKET}|g" \
            terraform/environments/dev/main.tf
          sed -i "s|athennian-terraform-locks|${TABLE}|g" \
            terraform/environments/dev/main.tf

          echo "Updated dev backend config:"
          grep -A6 'backend "s3"' terraform/environments/dev/main.tf

      - name: Commit patched backend config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/environments/dev/main.tf
          git diff --staged --quiet || git commit -m "ci: patch dev backend config with real bucket name [skip ci]"
          git push

  ###########################################################################
  # Step 3 — Deploy dev environment
  ###########################################################################
  deploy-dev:
    name: "3 — Deploy Dev Environment"
    runs-on: ubuntu-latest
    needs: patch-backend-config
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # get the patched version

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-dev

      - name: Find latest Amazon Linux 2023 AMI
        id: ami
        run: |
          AMI_ID=$(aws ec2 describe-images \
            --owners amazon \
            --filters \
              "Name=name,Values=al2023-ami-2023.*-x86_64" \
              "Name=state,Values=available" \
            --query "sort_by(Images, &CreationDate)[-1].ImageId" \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Using AMI: $AMI_ID"

      - name: Write dev tfvars
        working-directory: terraform/environments/dev
        run: |
          cat > terraform.tfvars << EOF
          aws_region  = "us-east-1"
          app_ami_id  = "${{ steps.ami.outputs.ami_id }}"
          EOF
          echo "tfvars written:"
          cat terraform.tfvars

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Import existing resources (idempotent)
        working-directory: terraform/environments/dev
        run: |
          tf_import() {
            local addr=$1; local id=$2
            echo "  Importing $addr ..."
            terraform import -var-file="terraform.tfvars" "$addr" "$id" 2>&1 || true
          }

          # KMS aliases — may already be in state, import is idempotent (|| true)
          for k in app ebs s3 secrets; do
            ALIAS="alias/athennian-dev-${k}"
            KEY=$(aws kms list-aliases \
              --query "Aliases[?AliasName=='${ALIAS}'].TargetKeyId" \
              --output text 2>/dev/null || true)
            if [ -n "$KEY" ] && [ "$KEY" != "None" ]; then
              tf_import "module.security.aws_kms_key.keys[\"${k}\"]" "$KEY"
              tf_import "module.security.aws_kms_alias.keys[\"${k}\"]" "$ALIAS"
            fi
          done

          # ELB target group
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names "athennian-dev-tg" \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text 2>/dev/null || echo "")
          if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
            tf_import "module.alb.aws_lb_target_group.app" "$TG_ARN"
          fi

          # IAM role and instance profile for EC2
          if aws iam get-role --role-name "athennian-dev-app-role" 2>/dev/null; then
            tf_import "module.ec2.aws_iam_role.app" "athennian-dev-app-role"
          fi
          if aws iam get-instance-profile --instance-profile-name "athennian-dev-app-profile" 2>/dev/null; then
            tf_import "module.ec2.aws_iam_instance_profile.app" "athennian-dev-app-profile"
          fi

          # OIDC provider (may exist in AWS but not in state)
          OIDC_ARN="arn:aws:iam::${{ env.ACCOUNT_ID }}:oidc-provider/token.actions.githubusercontent.com"
          if aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$OIDC_ARN" 2>/dev/null; then
            tf_import "module.security.aws_iam_openid_connect_provider.github[0]" "$OIDC_ARN"
          fi

          echo "Import step complete."

      - name: Terraform plan
        working-directory: terraform/environments/dev
        run: terraform plan -var-file="terraform.tfvars" -out=tfplan

      - name: Terraform apply
        working-directory: terraform/environments/dev
        run: terraform apply -input=false tfplan

      - name: Print outputs
        working-directory: terraform/environments/dev
        run: |
          echo ""
          echo "============================================"
          echo "  Dev Environment Deployed Successfully"
          echo "============================================"
          terraform output
